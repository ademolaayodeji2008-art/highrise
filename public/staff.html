<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Highrise Health Care — Manage Staff</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-wrap">
    <div class="topbar">
      <h1>Manage Staff</h1>
      <div>
        <a href="admin.html" class="link-btn" style="margin-right: 16px;">Back to admin</a>
        <button class="link-btn" id="logout-btn">Log out</button>
      </div>
    </div>

    <div class="qr-panel" style="text-align: left; margin-bottom: 24px;">
      <h3 style="margin-top: 0;">Add Staff Member</h3>
      <form id="create-form" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: end;">
        <div>
          <label for="c-name">Full name</label>
          <input type="text" id="c-name" style="width: auto;" />
        </div>
        <div>
          <label for="c-email">Email</label>
          <input type="email" id="c-email" style="width: auto;" />
        </div>
        <div>
          <label for="c-phone">Phone</label>
          <input type="tel" id="c-phone" style="width: auto;" />
        </div>
        <div>
          <label for="c-password">Password</label>
          <input type="password" id="c-password" style="width: auto;" />
        </div>
        <div>
          <label for="c-staffType">Staff type</label>
          <select id="c-staffType" style="width: auto;">
            <option value="professional">Professional (9:00 AM)</option>
            <option value="support">Support (8:00 AM)</option>
          </select>
        </div>
        <button type="submit" style="width: auto; margin-top: 0; padding: 10px 20px;">Create</button>
      </form>
      <div id="create-message" class="message" style="display: none;"></div>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Staff Type</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="staff-body">
          <tr><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
