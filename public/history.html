<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance History</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-wrap">
    <div class="topbar">
      <h1>Attendance History</h1>
      <div>
        <a href="admin.html" class="link-btn" style="margin-right: 16px;">Back to admin</a>
        <a href="summary.html" class="link-btn" style="margin-right: 16px;">Summary</a>
        <button class="link-btn" id="logout-btn">Log out</button>
      </div>
    </div>

    <div class="qr-panel" style="text-align: left;">
      <form id="filter-form" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: end;">
        <div>
          <label for="from">From</label>
          <input type="date" id="from" style="width: auto;" />
        </div>
        <div>
          <label for="to">To</label>
          <input type="date" id="to" style="width: auto;" />
        </div>
        <button type="submit" style="width: auto; margin-top: 0; padding: 10px 20px;">Filter</button>
        <button type="button" id="export-btn" style="width: auto; margin-top: 0; padding: 10px 20px; background: #334155;">Export CSV</button>
      </form>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Email</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
