<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="card">
      <h1>Create Staff Account</h1>
      <form id="signup-form">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name" />

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="phone">Phone number</label>
        <input type="tel" id="phone" required autocomplete="tel" />

        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" required autocomplete="new-password" minlength="6" />
          <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
        </div>

        <button type="submit">Sign up</button>
      </form>
      <div id="message"></div>
      <p style="margin-top: 16px; text-align: center;">
        <a href="login.html" id="login-link" style="color: #94a3b8;">Already have an account? Log in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/password-toggle.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
